
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#171717">

    <title>Instagram Media Saver</title>

    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>Instagram Media Saver</h1>
            <p>
                Instagramの投稿URLを受け取り、Firefoxで開きます。
            </p>
        </header>


        <!-- Instagram URL入力 -->

        <section class="input-panel">

            <label for="urlInput">
                Instagram URL
            </label>

            <textarea
                id="urlInput"
                placeholder="Instagramの投稿URLを入力、または共有してください"
                rows="3"
            ></textarea>

            <div class="button-group">

                <button id="checkButton" type="button">
                    アクセス検証開始
                </button>

                <button id="clearButton" type="button">
                    クリア
                </button>

            </div>

        </section>


        <!-- 投稿情報 -->

        <section id="resultPanel" class="panel hidden">

            <h2>投稿情報</h2>

            <div>
                <strong>投稿タイプ：</strong>
                <span id="postType"></span>
            </div>

            <div class="url-display">
                <strong>URL：</strong>
                <a
                    id="instagramLink"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                ></a>
            </div>


            <!-- Firefox起動 -->

            <div id="firefoxAction" class="firefox-action hidden">

                <button
                    id="firefoxButton"
                    class="firefox-button"
                    type="button"
                >
                    Open in Firefox
                </button>

                <p class="small-note">
                    FirefoxでInstagramの投稿を開きます。
                </p>

            </div>

        </section>


        <!-- アクセス検証結果 -->

        <section id="testPanel" class="panel hidden">

            <h2>アクセス検証結果</h2>

            <div class="test-result">

                <h3>Test A：Cookieなし</h3>

                <div id="resultA">
                    未実行
                </div>

            </div>


            <div class="test-result">

                <h3>Test B：Cookie送信許可</h3>

                <div id="resultB">
                    未実行
                </div>

            </div>

        </section>


        <!-- 検証サマリー -->

        <section id="summaryPanel" class="panel hidden">

            <h2>検証サマリー</h2>

            <div id="summary"></div>

        </section>


        <!-- Service Worker状態 -->

        <footer>

            <p id="swStatus">
                Service Worker status: checking...
            </p>

        </footer>

    </main>


    <script src="./app.js"></script>

</body>
</html>
